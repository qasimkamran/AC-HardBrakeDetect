name: Package HardBrakeDetect

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '$workflow')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 liblua5.4-dev luarocks zip
          sudo luarocks --lua-version=5.4 install luaunit

      - name: Verify test dependency
        run: lua5.4 -e "require('luaunit')"

      - name: Run tests
        run: lua5.4 test/run_tests.lua

      - name: Build release folder
        run: |
          rm -rf dist/HardBrakeDetect
          mkdir -p dist/HardBrakeDetect
          cp manifest.ini HardBrakeDetect.lua icon.png dist/HardBrakeDetect/
          cp -r lib data dist/HardBrakeDetect/

      - name: Create zip package
        run: |
          find dist/HardBrakeDetect -type f -name '*.mp4' -delete
          cd dist
          zip -r HardBrakeDetect.zip HardBrakeDetect -x '*.mp4'

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: HardBrakeDetect
          path: dist/HardBrakeDetect.zip
          if-no-files-found: error
